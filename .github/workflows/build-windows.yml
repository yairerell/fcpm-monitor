name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run:    run: pyinstaller --onefile --windowed --name "FCPM Monitor" fcpm-monitor-github-package/fcpm_monitor.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCPM-Monitor-Windows
          path: dist/FCPM Monitor.exe
